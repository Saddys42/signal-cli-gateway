[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signal-cli-gateway"
version = "0.1.0"
description = "REST + WebSocket gateway and Python SDK on top of signal-cli (JSON-RPC)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "signal-gateway contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "qrcode[pil]>=7.4",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
signal-gateway = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app", "client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
